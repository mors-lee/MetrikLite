<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MetrikLite</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel" aria-label="MetrikLite Codex 配额">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="./MetrikLite-icon.png" alt="" aria-hidden="true" />
          <div>
            <h1>MetrikLite</h1>
            <p id="status-line">
              <span class="status-dot"></span>
              <span id="status-text">正在连接 Codex…</span>
              <span class="status-separator">·</span>
              <span id="updated-at">等待更新</span>
            </p>
          </div>
        </div>
        <div class="top-actions">
          <button id="refresh-button" class="icon-button" type="button" title="立即刷新" aria-label="立即刷新">↻</button>
          <button id="close-panel-button" class="icon-button" type="button" title="关闭面板" aria-label="关闭面板">×</button>
        </div>
      </header>

      <section id="quota-content" class="quota-content" aria-live="polite">
        <article class="quota-card hidden" data-window="primary">
          <div class="card-heading">
            <span class="window-label">5 小时窗口</span>
            <p id="primary-reset" class="reset-line">等待重置时间</p>
          </div>
          <div class="quota-main">
            <strong id="primary-percent" class="quota-percent">—</strong>
            <div class="meter"><span id="primary-meter"></span></div>
          </div>
        </article>

        <article class="quota-card" data-window="secondary">
          <div class="card-heading">
            <span class="window-label">1 周窗口</span>
            <p id="secondary-reset" class="reset-line">等待重置时间</p>
          </div>
          <div class="quota-main">
            <strong id="secondary-percent" class="quota-percent">—</strong>
            <div class="meter"><span id="secondary-meter"></span></div>
          </div>
        </article>
      </section>

      <section id="empty-state" class="empty-state hidden">
        <div class="empty-symbol">!</div>
        <h2>暂时无法读取 Codex 配额</h2>
        <p id="empty-message">请确认已安装并登录独立 Codex CLI。</p>
      </section>

      <section id="settings-content" class="settings-content" aria-label="设置">
        <div class="settings-heading">
          <span class="section-title">偏好设置</span>
          <div class="theme-picker" role="group" aria-label="主题">
            <span>外观</span>
            <div class="theme-segment">
              <button id="light-theme-button" type="button" aria-pressed="true">浅色</button>
              <button id="dark-theme-button" type="button" aria-pressed="false">深色</button>
            </div>
          </div>
        </div>

        <div class="setting-row">
          <strong>刷新间隔</strong>
          <div class="range-row">
            <input id="refresh-seconds" type="range" min="10" max="300" step="10" value="30" />
            <output id="refresh-output">30 秒</output>
          </div>
        </div>

        <label class="toggle-row">
          <span><strong>开机自动启动</strong></span>
          <input id="autostart" type="checkbox" />
          <i aria-hidden="true"></i>
        </label>

        <div class="sheet-actions">
          <button id="check-update-button" class="secondary-button" type="button">检查更新</button>
          <button id="save-settings-button" class="primary-button" type="button">保存</button>
        </div>

      </section>

      <div id="toast" class="toast hidden" role="status"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
