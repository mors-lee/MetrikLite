name: CI

# 每次推送 / PR 做编译检查（与 Release 分开，参考 Metrik 的 ci.yml + release.yml 分工）。
# 注意：--smoke 冒烟测试需要本机 codex 登录态，CI 环境无法运行，仅在本地执行。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build MetrikLite.csproj -c Release
