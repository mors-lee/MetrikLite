name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend tooling
        run: npm ci

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $configVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($tagVersion -ne $configVersion -or $tagVersion -ne $cargoVersion) {
            throw "Tag ($tagVersion), tauri.conf.json ($configVersion), and Cargo.toml ($cargoVersion) must match."
          }

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: MetrikLite-SBOM.spdx.json

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MetrikLite ${{ github.ref_name }}
          releaseBody: |
            Windows installers and portable executable are built automatically from this public source tag.
            Verify downloads with SHA256SUMS.txt. The SBOM lists packaged dependencies.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi

      - name: Prepare portable executable and SHA256
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/metriklite.exe MetrikLite-portable.exe
          $artifacts = @(
            Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Include *.exe,*.msi
            Get-Item MetrikLite-portable.exe
            Get-Item MetrikLite-SBOM.spdx.json
          )
          $lines = $artifacts | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
          Get-Content SHA256SUMS.txt

      - name: Upload portable executable, checksums, and SBOM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            MetrikLite-portable.exe
            SHA256SUMS.txt
            MetrikLite-SBOM.spdx.json
          fail_on_unmatched_files: true
